[package]
name = "veriflat_kernel_core"
version = "0.1.0"
license = "MIT"
edition = "2024"

[lib]
path = "../../src/veriflat_kernel_core.rs"

[dependencies]
vstd = { path = "../../verus/source/vstd" }

[features]
default = ["split-crates"]
split-crates = []
# Declared only so that `cfg(feature = "no-pcid")` in `CpuTLB::write_cr3_pcid` is an expected cfg; see the root crate.
no-pcid = []

[package.metadata.verus]
verify = true
